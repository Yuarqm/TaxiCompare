---
# ── Namespace ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: taxicompare

---
# ── ConfigMap ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: taxicompare-config
  namespace: taxicompare
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  Jwt__Issuer: "TaxiCompare"
  Jwt__Audience: "TaxiCompare.Client"

---
# ── Secret ────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: taxicompare-secrets
  namespace: taxicompare
type: Opaque
stringData:
  Jwt__Secret: "CHANGE_ME_IN_PRODUCTION_32CHARS_MIN!!"
  ConnectionStrings__Postgres: "Host=postgres-svc;Database=taxicompare;Username=taxi;Password=taxi123"
  ConnectionStrings__Redis: "redis-svc:6379"

---
# ── Gateway Deployment ────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: taxicompare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/yourorg/taxicompare-gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: taxicompare-config
            - secretRef:
                name: taxicompare-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
# ── Gateway Service ───────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: gateway-svc
  namespace: taxicompare
spec:
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 8080

---
# ── Frontend Deployment ───────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: taxicompare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/yourorg/taxicompare-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"

---
# ── Frontend Service ──────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: taxicompare
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80

---
# ── Ingress ───────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taxicompare-ingress
  namespace: taxicompare
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - taxicompare.example.com
        - api.taxicompare.example.com
      secretName: taxicompare-tls
  rules:
    - host: taxicompare.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  number: 80
    - host: api.taxicompare.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-svc
                port:
                  number: 80

---
# ── HorizontalPodAutoscaler ────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
  namespace: taxicompare
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
