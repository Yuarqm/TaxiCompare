name: TaxiCompare CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/taxicompare

jobs:
  # ── Test ────────────────────────────────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taxicompare_test
          POSTGRES_USER: taxi
          POSTGRES_PASSWORD: taxi123
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore TaxiCompare.sln

      - name: Build solution
        run: dotnet build TaxiCompare.sln --no-restore -c Release

      - name: Run unit tests
        run: dotnet test tests/Domain.Tests --no-build -c Release --logger trx --results-directory TestResults/

      - name: Run application tests
        run: dotnet test tests/Application.Tests --no-build -c Release --logger trx --results-directory TestResults/

      - name: Run integration tests
        run: dotnet test tests/Integration.Tests --no-build -c Release --logger trx --results-directory TestResults/
        env:
          ConnectionStrings__Postgres: "Host=localhost;Database=taxicompare_test;Username=taxi;Password=taxi123"
          ConnectionStrings__Redis: "localhost:6379"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/

  # Docker & Deploy отключены — деплой происходит автоматически через Render
  # при каждом пуше в main (Render следит за репозиторием напрямую)
