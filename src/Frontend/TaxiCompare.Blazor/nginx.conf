server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/wasm;

    location ~* \.(js|css|wasm|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

location /api/ {
    proxy_pass https://taxicompare-gateway.onrender.com/api/;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host taxicompare-gateway.onrender.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_pass_header Authorization;
    proxy_read_timeout 60s;
    proxy_connect_timeout 60s;
}

    location /hubs/ {
        proxy_pass https://taxicompare-gateway.onrender.com/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host taxicompare-gateway.onrender.com;
        proxy_cache_bypass $http_upgrade;
    }

location /health {
    proxy_pass https://taxicompare-gateway.onrender.com/health;

    proxy_ssl_server_name on;

    proxy_http_version 1.1;

    proxy_set_header Host taxicompare-gateway.onrender.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

    location / {
        try_files $uri $uri/ /index.html;
    }
}